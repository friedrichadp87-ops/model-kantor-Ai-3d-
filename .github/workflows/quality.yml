name: Kantor AI 3D Quality Checks

on:
  push:
    branches:
      - main
      - security/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile when needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile [skip ci]"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
